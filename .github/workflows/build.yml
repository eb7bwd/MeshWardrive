name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Preparar la clave de firma
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: No publicar una release sin clave fija
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "Faltan los secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD" >&2
          exit 1

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MeshWardrive.apk

      - uses: actions/upload-artifact@v5
        with:
          name: MeshWardrive-apk
          path: MeshWardrive.apk

      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp MeshWardrive.apk "MeshWardrive-$VERSION.apk"
          NOTES="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" "MeshWardrive-$VERSION.apk" \
              --title "MeshWardrive $VERSION" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "MeshWardrive-$VERSION.apk" \
              --title "MeshWardrive $VERSION" --generate-notes
          fi
